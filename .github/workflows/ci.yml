name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR cancels the run for the older one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # go vet, gofmt and every Go test. The store tests need Postgres: the same
  # image and credentials the e2e harness uses (tests/env.py).
  go:
    runs-on: ubuntu-26.04
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: lux
          POSTGRES_PASSWORD: lux
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U lux"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: make lint
        run: make lint

      - name: make unit
        run: make unit

      # The store tests skip when Postgres is unreachable: here it must
      # be, so a skip is a broken setup, not a pass.
      - name: The store tests ran
        run: |
          go test ./internal/store -count=1 -v 2>&1 | tee store.log
          ! grep -E -- '--- SKIP' store.log
        env:
          LUX_TEST_PG: postgres://lux:lux@127.0.0.1:55432/postgres?sslmode=disable

  # The console: typecheck, its tests, and the build luxd embeds.
  console:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: make console
        run: make console

  # The e2e harness's own configuration; no Docker.
  harness:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: tests
          enable-cache: true

      - name: make harness-unit
        run: make harness-unit

  # Every e2e suite, split into 6 shards by recorded duration
  # (tests/.suite-seconds.json), each on its own runner with one environment:
  # four environments on one standard runner overload it. Privileged Podman
  # hosts, Postgres and S3 in Docker, luxd on the runner. The agent suites
  # skip without their API keys, the real-EC2 ones without --real-ec2.
  e2e:
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: e2e (${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: astral-sh/setup-uv@v6
        with:
          working-directory: tests
          enable-cache: true

      # luxd embeds console/dist: without it the console suites see only a
      # page saying to build it.
      - name: Build the console
        run: make console

      # The console suites drive a browser.
      - name: Install Chromium for Playwright
        working-directory: tests
        run: uv run playwright install --with-deps chromium

      # The runner image ships passt, whose AppArmor profile attaches to
      # /usr/bin/pasta by path, in containers too: rootless Podman inside a
      # nested Run keeps its netns under /tmp/storage-run-<uid>, which the
      # profile does not allow. Real Ubuntu hosts with passt installed hit
      # the same (follow-up: handle it in the runner).
      - name: Let nested Podman's pasta run unconfined
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apparmor_parser -R /etc/apparmor.d/usr.bin.pas* 2>/dev/null || true

      - name: e2e shard
        working-directory: tests
        env:
          LUX_TEST_LOG_ROOT: ${{ runner.temp }}/lux-e2e
        run: uv run python run_tests.py --shard ${{ matrix.shard }}/6

      - name: Upload the e2e logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.shard }}
          path: ${{ runner.temp }}/lux-e2e
          retention-days: 7
