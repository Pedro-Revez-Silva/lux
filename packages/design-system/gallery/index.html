<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>lux design system</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 1.5Q17.3 14.7 30.5 16Q17.3 17.3 16 30.5Q14.7 17.3 1.5 16Q14.7 14.7 16 1.5Z' fill='%23ffd166' stroke='%23163f7a' stroke-width='1.25' stroke-linejoin='round'/%3E%3Cpath d='M16 3Q14.8 14.8 3 16L16 16Z' fill='%23fff4cc'/%3E%3Cpath d='M29 16Q17.2 17.2 16 29L16 16Z' fill='%23ff9f43'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme and density before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("lux.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("lux.density") === "compact") document.documentElement.dataset.density = "compact";
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../src/tokens.css" />
    <link rel="stylesheet" href="../src/base.css" />
    <link rel="stylesheet" href="../src/components.css" />
    <link rel="stylesheet" href="../src/layout.css" />
    <link rel="stylesheet" href="./gallery.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
