<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>lux design system</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='2' fill='%232a78d6'/%3E%3C/svg%3E" />
    <script>
      // Apply the stored theme and density before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("lux.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        if (localStorage.getItem("lux.density") === "compact") document.documentElement.dataset.density = "compact";
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../src/tokens.css" />
    <link rel="stylesheet" href="../src/base.css" />
    <link rel="stylesheet" href="../src/components.css" />
    <link rel="stylesheet" href="../src/layout.css" />
    <link rel="stylesheet" href="./gallery.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
