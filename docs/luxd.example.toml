# luxd configuration. luxd reads this file from --config, else LUX_CONFIG,
# else /etc/lux/luxd.toml if it exists. Every setting also has an
# environment variable (given beside it), which overrides the file.
# Everything but database.url and s3.bucket has a default: shown here.

listen = "127.0.0.1:7070"          # LUX_LISTEN
public_url = ""                    # LUX_PUBLIC_URL: the URL runners and clients use
runner_url = ""                    # LUX_RUNNER_URL: what runners dial, if different (a private IP); empty: public_url
runner_bin_dir = "/usr/local/lib/lux/runner"  # LUX_RUNNER_BIN_DIR: runner binaries luxd serves and hashes for self-update
debug = false                      # LUX_DEBUG

lease = "30s"                      # LUX_LEASE: a host silent this long is lost
tick = "1s"                        # LUX_TICK: scheduler and reaper interval
scale_down_after = "10m"           # LUX_SCALE_DOWN_AFTER
launch_timeout = "10m"             # LUX_LAUNCH_TIMEOUT
provider_check_every = "1m"        # LUX_PROVIDER_CHECK_EVERY: list each pool's instances (orphans, vanished)
lost_grace = "5m"                  # LUX_LOST_GRACE: a lost provisioned host's instance is kept this long
listing_lag = "1m"                 # LUX_LISTING_LAG: how long after a launch the provider's listings may miss it
outdated_drain_percent = 10        # LUX_OUTDATED_DRAIN_PERCENT: caps concurrent outdated-binaries drains per pool (of its live hosts; at least 1)

[database]
# LUX_DATABASE_URL. serve connects as lux_app; migrate needs the database
# owner: keep serve's here and set LUX_DATABASE_URL for migrate.
url = "postgres://lux_app:…@db:5432/lux"
app_password = "lux_app"           # LUX_APP_PASSWORD: migrate sets lux_app's password to it. Set your own.

[s3]
bucket = "lux"                     # LUX_S3_BUCKET
endpoint = ""                      # LUX_S3_ENDPOINT: MinIO and the like; empty: AWS
public_endpoint = ""               # LUX_S3_PUBLIC_ENDPOINT
region = "us-east-1"               # LUX_S3_REGION
access_key = ""                    # LUX_S3_ACCESS_KEY (empty: the AWS chain)
secret_key = ""                    # LUX_S3_SECRET_KEY

[defaults]                         # a Run's resources where its spec sets none
cpus = 2                           # LUX_DEFAULT_CPUS
memory = "8Gi"                     # LUX_DEFAULT_MEMORY
disk = "20Gi"                      # LUX_DEFAULT_DISK: writable layer plus state volumes
pids = 1024                        # LUX_DEFAULT_PIDS

[history]
sample_every = "10s"               # LUX_SAMPLE_EVERY
raw = "48h"                        # LUX_HISTORY_RAW
minutes = "720h"                   # LUX_HISTORY_MINUTES
hours = "9600h"                    # LUX_HISTORY_HOURS
disk_paths = ["/"]                 # LUX_HISTORY_DISK_PATHS (comma-separated): filesystems of luxd's own machine to chart; a missing one is skipped; [] tracks none

[costs]
# What each Run costs (docs/costs.md): a tick queues every live Run, and every
# luxd drains the queue. Off stops both (state changes still queue their Runs).
enabled = true                     # LUX_COSTS
every = "2m"                       # LUX_COSTS_EVERY: the active-Run tick
drain_every = "2s"                 # LUX_COSTS_DRAIN_EVERY: queue poll (also woken by Run events)
batch = 1000                       # LUX_COSTS_BATCH: Runs one drain claims
settle = ["10m", "1h"]             # LUX_COSTS_SETTLE: re-ask after a Run finishes
settle_give_up = "168h"            # LUX_COSTS_SETTLE_GIVE_UP: stop retrying after 7 days
backoff = "10s"                    # LUX_COSTS_BACKOFF: initial retry delay
backoff_max = "10m"                # LUX_COSTS_BACKOFF_MAX: retry delay ceiling
describe_every = "1h"             # LUX_COSTS_DESCRIBE_EVERY: refresh plugin metadata

[costs.compute]
ec2 = true                         # LUX_COSTS_COMPUTE_EC2: price EC2 hosts
prices_refresh = "24h"             # LUX_COSTS_PRICES_REFRESH: on-demand price cache
pricing_region = "us-east-1"       # LUX_COSTS_PRICING_REGION: where the Pricing API is called
pricing_endpoint = ""              # LUX_PRICING_ENDPOINT (tests)

# Optional. LUX_COSTS_PLUGINS replaces the whole list with a JSON array of
# objects using these same keys. No token value belongs in this file.
# [[costs.plugin]]
# name = "model-gateway"             # unique source name; not "compute"
# url = "https://costs.internal:8443"
# token_file = "/etc/lux/model-gateway.token" # or token_env = "MODEL_GATEWAY_TOKEN"
# timeout = "30s"                   # optional; default 30s
# max_batch = 200                   # optional; default 200
# settle = ["15m", "2h"]            # optional; else describe's, else costs.settle
# insecure = false                  # allow public plain HTTP only when true

[ec2]
endpoint = ""                      # LUX_EC2_ENDPOINT (tests)

[console]
# How the web console signs people in (docs/operators.md#signing-in):
#   key                a pasted API key (the default)
#   cloudflare-access  luxd is behind a Cloudflare Access application; whoever
#                      Access lets in is an operator. API keys still work.
auth = "key"                       # LUX_CONSOLE_AUTH

[console.cloudflare_access]
team = ""                          # LUX_CF_ACCESS_TEAM: acme, or acme.cloudflareaccess.com
aud = ""                           # LUX_CF_ACCESS_AUD: the application's AUD tag
