            type: string
        - description: The pool's name.
          in: path
          name: name
          required: true
          schema:
            description: The pool's name.
            type: string
        - description: "Which pool of that name: the platform's, or a tenant's (the caller's, or with ?tenant= that tenant's). Omitted: a tenant's own pool, else the platform's; for an operator not narrowed with ?tenant=, a name two pools share is ambiguous (409)."
          explode: false
          in: query
          name: owner
          schema:
            description: "Which pool of that name: the platform's, or a tenant's (the caller's, or with ?tenant= that tenant's). Omitted: a tenant's own pool, else the platform's; for an operator not narrowed with ?tenant=, a name two pools share is ambiguous (409)."
            enum:
