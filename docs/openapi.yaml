      type: object
    VolumeSnapshot:
      additionalProperties: false
      properties:
        blobId:
          type: string
        name:
          type: string
        path:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
      type: object
    Whoami:
      additionalProperties: false
      properties:
        consoleAuth:
          type: string
        email:
          type: string
        keyId:
          type: string
        name:
          type: string
        operator:
          type: boolean
        picture:
          type: string
        previewDomain:
          description: The preview listener's domain (preview URLs are https://<server>-<run suffix>.<domain>); null when previews are off, or signed in to through Cloudflare Access rather than a ticket.
          type:
            - string
            - "null"
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
        tenant:
          description: The key's tenant's name; empty for an operator key.
          type: string
        tenantId:
          type: string
      type: object
    Workload:
      additionalProperties: false
      properties:
        adapter:
          type: string
        beforeStop:
          $ref: "#/components/schemas/BeforeStop"
          description: "A command run in the container on every stop, before the workload is signalled: a stop asked for, a cancel, a timeout, a drain. Its output is the Run's; what it writes into $LUX_ARTIFACTS is collected. It cannot run when the container dies or its host is lost."
        command:
          items:
            type: string
          type:
            - array
            - "null"
        grace:
          description: A Go duration ("4h", "90s"), or a number of seconds. Responses carry the string.
          oneOf:
            - examples:
                - 4h
              type: string
            - type: number
        mcpServers:
          description: MCP servers (streamable HTTP) the agent connects to, through its adapter. Each URL's host must be allowed by network.egress (unless unrestricted), and may not be the control plane's.
          items:
            $ref: "#/components/schemas/MCPServer"
          type:
            - array
            - "null"
        prompt:
          type: string
        resume:
          $ref: "#/components/schemas/Resume"
        servers:
          description: "Servers: named ports of the Run, each optionally with a command lux starts in the container, as the workload's user with its environment. Started on every start of the Run (a resume, a migration). More can be added while it runs (POST /v1/runs/{id}/servers)."
          items:
            $ref: "#/components/schemas/Server"
          type:
            - array
            - "null"
        services:
          description: "HTTP services the workload calls through a local socket (/.lux/services/<name>.sock, named in LUX_SERVICE_<NAME>), which adds their headers: the workload never holds the credentials. Same URL rules as mcpServers."
          items:
            $ref: "#/components/schemas/Service"
          type:
            - array
            - "null"
        tty:
          type: boolean
        user:
          type: string
        workdir:
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: A tenant API key (luxd admin create-key), or an operator key (luxd admin create-operator-key).
      scheme: bearer
      type: http
info:
  description: |-
    The lux tenant API. Every /v1 call authenticates with an API key (`Authorization: Bearer <key>`); a key has scopes `read`, `run` and `admin`, each implying the ones before it.

    An operator key (`luxd admin create-operator-key`, scope `operator`) belongs to no tenant: it sees and acts on every tenant through the same operations. A Run's operations act in the Run's own tenant; lists span every tenant unless `?tenant=` (an id or a name) narrows them; creating needs `?tenant=`.

    Errors are JSON: `{"error": {"code": "not_found", "message": "...", "details": ["..."]}}`, with a stable `code`.
  title: lux
  version: dev
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Check luxd is up
  /v1/artifacts/{aid}:
    get:
      description: |-
        The file the Run wrote, streamed through luxd. Content-Length and X-Lux-SHA256 let a client tell a whole download from one cut short (the response is aborted, never ended cleanly, on a failure mid-way). 409 not_uploaded (with Retry-After) while it is still on its host; 410 gone once deleted by retention.

        Needs the `read` scope.
      operationId: downloadArtifact
      parameters:
        - description: The artifact's id.
          in: path
          name: aid
          required: true
          schema:
            description: The artifact's id.
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The file.
          headers:
            Content-Disposition:
              description: attachment, with the file's name.
              schema:
                type: string
            Content-Length:
              description: The file's size.
              schema:
                type: integer
            X-Lux-SHA256:
              description: The file's SHA-256, hex.
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gone
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Download an artifact
      tags:
        - runs
  /v1/costs:
    get:
      description: Needs the `read` scope.
      operationId: costSummary
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: "How far back from now: a Go duration or a number of days (7d). Default 1h."
          explode: false
          in: query
          name: since
          schema:
            description: "How far back from now: a Go duration or a number of days (7d). Default 1h."
            examples:
              - 24h
            type: string
        - description: The start (RFC 3339), instead of since.
          explode: false
          in: query
          name: from
          schema:
            description: The start (RFC 3339), instead of since.
            type: string
        - description: The end (RFC 3339); default now.
          explode: false
          in: query
          name: to
          schema:
            description: The end (RFC 3339); default now.
            type: string
        - description: "Resolution in seconds: 0 (raw), 60 or 3600. Default: the finest kept for the range."
          explode: false
          in: query
          name: res
          schema:
            description: "Resolution in seconds: 0 (raw), 60 or 3600. Default: the finest kept for the range."
            type: string
        - description: "Repeat up to twice: tenant (operators), pool, host, family, run, label:key."
          explode: true
          in: query
          name: group
          schema:
            description: "Repeat up to twice: tenant (operators), pool, host, family, run, label:key."
            items:
              type: string
            type:
              - array
              - "null"
        - description: Only this family.
          explode: false
          in: query
          name: family
          schema:
            description: Only this family.
            type: string
        - description: hour or day; include a time series.
          explode: false
          in: query
          name: interval
          schema:
            description: hour or day; include a time series.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummaryBody"
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Summarize costs by currency, time and up to two groups
      tags:
        - costs
  /v1/events:
    get:
      description: |-
        Server-sent events: one `lux` event per Run event, oldest first, each with its id (`id:`, and resume with Last-Event-ID or `after`). From now, from `after`, or the `last` N; with `follow=false` the stream ends after what is there now.

        Needs the `read` scope.
      operationId: eventFeed
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: "From after this event id (default: from now)."
          explode: false
          in: query
          name: after
          schema:
            description: "From after this event id (default: from now)."
            type: string
        - description: Start with the last N events (at most 500), instead of from now.
          explode: false
          in: query
          name: last
          schema:
            description: Start with the last N events (at most 500), instead of from now.
            format: int64
            type: integer
        - description: "false: end after what there is now."
          explode: false
          in: query
          name: follow
          schema:
            description: "false: end after what there is now."
            type: string
        - description: "A reconnecting client's last event id: resumes after it."
          in: header
          name: Last-Event-ID
          schema:
            description: "A reconnecting client's last event id: resumes after it."
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: "Server-sent events: `event: <type>` and `data: <JSON>` lines, each event ended by a blank line."
                items:
                  oneOf:
                    - description: A Run's event.
                      properties:
                        data:
                          $ref: "#/components/schemas/FeedEvent"
                        event:
                          const: lux
                          type: string
                      required:
                        - event
                        - data
                      title: lux
                      type: object
                    - description: The stream failed.
                      properties:
                        data:
                          $ref: "#/components/schemas/OutputError"
                        event:
                          const: error
                          type: string
                      required:
                        - event
                        - data
                      title: error
                      type: object
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Every Run's events, as they happen
      tags:
        - runs
  /v1/history:
    get:
      description: |-
        Samples of what GET /v1/status reports. For an operator key reading the whole system (no tenant), each sample also carries `control`: the machine luxd runs on and its Postgres.

        Needs the `read` scope.
      operationId: history
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: "How far back from now: a Go duration or a number of days (7d). Default 1h."
          explode: false
          in: query
          name: since
          schema:
            description: "How far back from now: a Go duration or a number of days (7d). Default 1h."
            examples:
              - 24h
            type: string
        - description: The start (RFC 3339), instead of since.
          explode: false
          in: query
          name: from
          schema:
            description: The start (RFC 3339), instead of since.
            type: string
        - description: The end (RFC 3339); default now.
          explode: false
          in: query
          name: to
          schema:
            description: The end (RFC 3339); default now.
            type: string
        - description: "Resolution in seconds: 0 (raw), 60 or 3600. Default: the finest kept for the range."
          explode: false
          in: query
          name: res
          schema:
            description: "Resolution in seconds: 0 (raw), 60 or 3600. Default: the finest kept for the range."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: The state of the system over time
      tags:
        - history
  /v1/hosts:
    get:
      description: |-
        The tenant's own hosts, and platform hosts in pools it can use. Operators: every host.

        Needs the `read` scope.
      operationId: listHosts
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: true to include terminated hosts.
          explode: false
          in: query
          name: all
          schema:
            description: true to include terminated hosts.
            examples:
              - "true"
            type: string
        - description: Only this pool's hosts.
          explode: false
          in: query
          name: pool
          schema:
            description: Only this pool's hosts.
            type: string
        - description: "Only hosts in this state: provisioning, ready, draining, lost or terminated."
          explode: false
          in: query
          name: state
          schema:
            description: "Only hosts in this state: provisioning, ready, draining, lost or terminated."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: List hosts
      tags:
        - hosts
  /v1/hosts/{id}:
    get:
      description: |-
        With its live placements.

        Needs the `read` scope.
      operationId: getHost
      parameters:
        - description: The host's id or name (a name of a host that is not terminated).
          in: path
          name: id
          required: true
          schema:
            description: The host's id or name (a name of a host that is not terminated).
            type: string
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Get a host
      tags:
        - hosts
  /v1/hosts/{id}/cost:
