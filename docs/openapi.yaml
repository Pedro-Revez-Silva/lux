            examples:
              - "0"
            type: string
        - description: "Only events newer than this id. With before, the events between the two (both exclusive), still newest first: a gap between two pages already read."
          explode: false
          in: query
          name: after
          schema:
            description: "Only events newer than this id. With before, the events between the two (both exclusive), still newest first: a gap between two pages already read."
