  /v1/runs/{id}/exec:
    get:
      description: |-
        A WebSocket (send `Upgrade: websocket`), relayed to the Run's host, carrying JSON text messages. The client's first message is a StreamOpen: `{"command": [...], "tty": true, "rows": 24, "cols": 80}`. A browser authenticates with `?ticket=` (POST /v1/runs/{id}/tickets, kind exec) instead of a header; a page of another origin than luxd's is refused (403 bad_origin). Then StreamData both ways: `{"data": <base64>}` for bytes, `{"eof": true}` to close input, `{"rows", "cols"}` to resize. The stream ends with one `{"exitCode": N}` (exec) or `{"error": "..."}`, or just the socket closing, and luxd closes it.

        Without the upgrade the same URL answers 200 `{"status": "ok"}` if the stream could be opened, and the error it would get otherwise, so a client can check first.

