  /v1/runs/{id}/output:
    get:
      description: |-
        The Run's output as server-sent events, from wherever it is: relayed from its host while it runs, from S3 once uploaded. Events: `record` (one output record; its `cursor` resumes the stream with `since`), `lux` (a lifecycle event, with `events=true`), `gap` (output that cannot be had, e.g. lost with its host), `error` (the stream failed) and `end` (the last event: where to resume and the Run's state). Without `follow` the stream ends after what is there now.

        Needs the `read` scope.
      operationId: streamOutput
      parameters:
        - description: The Run's id.
          in: path
          name: id
          required: true
          schema:
            description: The Run's id.
            type: string
        - description: Only records after this cursor (from a record or the end event).
          explode: false
          in: query
          name: since
          schema:
            description: Only records after this cursor (from a record or the end event).
            examples:
              - "1.42"
            type: string
        - description: true to keep streaming until the Run stops or finishes.
          explode: false
          in: query
          name: follow
          schema:
            description: true to keep streaming until the Run stops or finishes.
            examples:
              - "true"
            type: string
        - description: true to interleave lifecycle events (lux events).
          explode: false
          in: query
          name: events
          schema:
            description: true to interleave lifecycle events (lux events).
            examples:
              - "true"
            type: string
        - description: With events, only lifecycle events after this id.
          explode: false
          in: query
          name: afterEvent
          schema:
            description: With events, only lifecycle events after this id.
            examples:
              - "0"
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: "Server-sent events: `event: <type>` and `data: <JSON>` lines, each event ended by a blank line."
                items:
                  oneOf:
                    - description: One output record.
                      properties:
                        data:
                          $ref: "#/components/schemas/OutputRecord"
                        event:
                          const: record
                          type: string
                      required:
                        - event
                        - data
                      title: record
                      type: object
                    - description: A lifecycle event (events=true).
                      properties:
                        data:
                          $ref: "#/components/schemas/Event"
                        event:
                          const: lux
                          type: string
                      required:
                        - event
                        - data
                      title: lux
                      type: object
                    - description: Output of a placement that cannot be had.
                      properties:
                        data:
                          $ref: "#/components/schemas/OutputGap"
                        event:
                          const: gap
                          type: string
                      required:
                        - event
                        - data
                      title: gap
                      type: object
                    - description: The stream failed.
                      properties:
                        data:
                          $ref: "#/components/schemas/OutputError"
                        event:
                          const: error
                          type: string
                      required:
                        - event
                        - data
                      title: error
                      type: object
                    - description: The last event.
                      properties:
                        data:
                          $ref: "#/components/schemas/OutputEnd"
                        event:
                          const: end
                          type: string
                      required:
                        - event
                        - data
                      title: end
                      type: object
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Stream a Run's output
      tags:
        - runs
  /v1/runs/{id}/ports/{name}:
    get:
      description: |-
        A WebSocket (send `Upgrade: websocket`), relayed to the Run's host, carrying JSON text messages. A TCP connection to a port the spec declares in network.ports, carried as StreamData. Then StreamData both ways: `{"data": <base64>}` for bytes, `{"eof": true}` to close input, `{"rows", "cols"}` to resize. The stream ends with one `{"exitCode": N}` (exec) or `{"error": "..."}`, or just the socket closing, and luxd closes it.

        Without the upgrade the same URL answers 200 `{"status": "ok"}` if the stream could be opened, and the error it would get otherwise, so a client can check first.

        Needs the `run` scope.
      operationId: portForward
      parameters:
        - description: The Run's id.
          in: path
          name: id
          required: true
          schema:
            description: The Run's id.
            type: string
        - description: The port's name in the spec's network.ports.
          in: path
          name: name
          required: true
          schema:
            description: The port's name in the spec's network.ports.
            type: string
      responses:
        "101":
          description: Switching to the WebSocket.
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusBody"
          description: The stream can be opened (no Upgrade header).
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
      security:
        - apiKey: []
      summary: Reach one of a running Run's ports
      tags:
        - interactive
      x-websocket:
        message:
          $ref: "#/components/schemas/StreamData"
  /v1/runs/{id}/push:
    post:
      description: |-
        To the spec's git.push branch, with the runner's credentials. The outcome arrives as a git.push event carrying the request id.

        expect: per repository, the commit the push branch must be at for the push to go ahead (a compare-and-swap). Without it, the lease is what this Run last pushed, or, the first time, that the branch does not exist.

        Needs the `run` scope.
      operationId: pushRun
      parameters:
        - description: The Run's id.
          in: path
          name: id
          required: true
          schema:
            description: The Run's id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccepted"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Push a running Run's repositories
      tags:
        - runs
  /v1/runs/{id}/resume:
    post:
      description: |-
        From its latest snapshot (or fromSnapshot), on any host. Its secrets must be supplied again. Idempotent while resuming.

        git.repositories adds repositories: the runner clones them into the restored workspace before the Run starts, each reported as a git.clone event with the request id (Lux-Request-Id). One whose clone fails is dropped from the spec and the Run goes on without it. Adding needs a stopped, lost or failed Run: while it is resuming, 409.

        Needs the `run` scope.
      operationId: resumeRun
      parameters:
        - description: The Run's id.
          in: path
          name: id
          required: true
          schema:
            description: The Run's id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
          description: Accepted
          headers:
            Lux-Request-Id:
              schema:
                description: The resume's request id (requestId, or the one generated).
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Resume a stopped, lost or failed Run
      tags:
        - runs
