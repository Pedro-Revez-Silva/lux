        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestAccepted"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Push a running Run's repositories
      tags:
        - runs
  /v1/runs/{id}/resume:
    post:
      description: |-
        From its latest snapshot (or fromSnapshot), on any host. Its secrets must be supplied again. Idempotent while resuming.

        git.repositories adds repositories: the runner clones them into the restored workspace before the Run starts, each reported as a git.clone event with the request id (Lux-Request-Id). One whose clone fails is dropped from the spec and the Run goes on without it. Adding needs a stopped, lost or failed Run: while it is resuming, 409.

        Needs the `run` scope.
      operationId: resumeRun
      parameters:
        - description: The Run's id.
          in: path
          name: id
          required: true
          schema:
            description: The Run's id.
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
          description: Accepted
          headers:
            Lux-Request-Id:
              schema:
                description: The resume's request id (requestId, or the one generated).
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Resume a stopped, lost or failed Run
      tags:
        - runs
