  /v1/runs/{id}/diff:
    get:
      description: |-
        Per repository, from its base to its working tree: committed changes, staged, unstaged and untracked (not ignored) files. One live diff runs per Run at a time: identical requests share it, and a different one meanwhile is 429 `diff_busy`. `base=clone` (default) diffs from the commit the repository was cloned at (for one added on resume, that clone's); `base=head` from its HEAD, uncommitted work only. While the Run's container runs the diff is computed there, now (`source: live`); a host whose runner predates diffs is 503 `diff_unsupported`. Otherwise it is the one stored with the Run's latest snapshot (`source: snapshot`, with its id and time; the highest epoch's, then the newest), which holds both bases, and that snapshot alone answers: while its diff is still being computed, 409 `diff_pending` (with `retryAfter`, seconds, and `snapshotId`); when it has none (skipped, failed, its runner does not compute diffs, or it predates them), 404 `diff_unavailable` with `reason` and `snapshotId`, never an older snapshot's diff. `snapshot=<id>` asks for that snapshot's diff instead (the only way to an older one). 404 `no_diff` when the Run has no repositories or no snapshot yet. Patches are git binary patches (they apply with `git apply`; see the RunSpec's Diffs section for what they cannot carry). Each is cut at 10 MiB after the last whole file's diff that fits, possibly none (`truncated`); the stats cover the whole diff.

        With `Accept: text/x-diff`, the patches alone, one after the other.

        Needs the `read` scope.
      operationId: runDiff
      parameters:
        - description: The Run's id.
          in: path
          name: id
          required: true
          schema:
            description: The Run's id.
            type: string
        - description: This snapshot's diff, not the latest one's (nor a live one).
          explode: false
          in: query
          name: snapshot
          schema:
            description: This snapshot's diff, not the latest one's (nor a live one).
            type: string
        - description: Only this repository.
          explode: false
          in: query
          name: repo
          schema:
            description: Only this repository.
            type: string
        - description: "clone (default): from the commit each repository was cloned at. head: from its HEAD (uncommitted work only)."
          explode: false
          in: query
          name: base
          schema:
            description: "clone (default): from the commit each repository was cloned at. head: from its HEAD (uncommitted work only)."
            enum:
              - clone
              - head
            type: string
        - description: true for only the stats, no patches.
          explode: false
          in: query
          name: stat
          schema:
            description: true for only the stats, no patches.
            examples:
              - "true"
            type: string
        - description: text/x-diff for the patches alone, concatenated.
          in: header
          name: Accept
          schema:
            description: text/x-diff for the patches alone, concatenated.
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RunDiff"
            text/x-diff:
              schema:
                description: The patches, concatenated (git diff format).
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gone
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
        "502":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Bad Gateway
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Service Unavailable
        "504":
