components:
  schemas:
    Artifact:
      additionalProperties: false
      properties:
        available:
          type: boolean
        contentType:
          type: string
        createdAt:
          format: date-time
          type: string
        epoch:
          format: int64
          type: integer
        id:
          type: string
        path:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
      type: object
    ArtifactList:
      additionalProperties: false
      properties:
        artifacts:
          items:
            $ref: "#/components/schemas/Artifact"
          type:
            - array
            - "null"
      type: object
    Artifacts:
      additionalProperties: false
      properties:
        paths:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    Build:
      additionalProperties: false
      properties:
        args:
          additionalProperties:
            type: string
          type: object
        cache:
          description: "A registry repository (no tag), e.g. registry.example.com/team/lux-cache, shared by hosts: a host pulls <cache>:<build key> instead of building, and pushes what it builds there. The key covers the tenant, egress rules, pinned Containerfile and args."
          type: string
        containerfile:
          type: string
        context:
          type: string
      type: object
    Capacity:
      additionalProperties: false
      properties:
        cpus:
          format: double
          type: number
        disk:
          format: int64
          type: integer
        memory:
          format: int64
          type: integer
        runs:
          format: int64
          type: integer
      type: object
    DrainHostRequest:
      additionalProperties: false
      properties:
        forceEvict:
          description: Also stop this host's live Runs so they resume elsewhere. Without it, they finish where they are; only new placements are refused.
          type: boolean
      type: object
    EgressRule:
      additionalProperties: false
      properties:
        cidr:
          type: string
        host:
          type: string
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
      type: object
    ErrorInfo:
      additionalProperties: false
      properties:
        code:
          description: Stable error code, e.g. not_found, invalid_spec, quota_exceeded.
          type: string
        details:
          description: Every problem, when there are several (invalid_spec, secrets_required, validation).
          items:
            type: string
          type:
            - array
            - "null"
        message:
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        data:
          additionalProperties: {}
          type: object
        epoch:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        time:
          format: date-time
          type: string
        type:
          type: string
      type: object
    EventList:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/Event"
          type:
            - array
            - "null"
      type: object
    FeedEvent:
      additionalProperties: false
      properties:
        data:
          additionalProperties: {}
          type: object
        epoch:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        runId:
          type: string
        tenant:
          type: string
        time:
          format: date-time
          type: string
        type:
          type: string
      type: object
    Git:
      additionalProperties: false
      properties:
        push:
          $ref: "#/components/schemas/Push"
        repositories:
          items:
            $ref: "#/components/schemas/Repository"
          type:
            - array
            - "null"
      type: object
    History:
      additionalProperties: false
      properties:
        from:
          format: date-time
          type: string
        resolution:
          format: int64
          type: integer
        samples:
          items:
            $ref: "#/components/schemas/Sample"
          type:
            - array
            - "null"
        to:
          format: date-time
          type: string
      type: object
    Host:
      additionalProperties: false
      properties:
        allocated:
          $ref: "#/components/schemas/Resources"
        capacity:
          $ref: "#/components/schemas/Capacity"
        draining:
          type: boolean
        id:
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lastHeartbeat:
          format: date-time
          type: string
        liveRuns:
          format: int64
          type: integer
        name:
          type: string
        placements:
          items:
            $ref: "#/components/schemas/HostPlacement"
          type:
            - array
            - "null"
        platform:
          type: boolean
        pool:
          type: string
        providerId:
          type: string
        state:
          type: string
        stateReason:
          type: string
        tenant:
          description: The owning tenant's name; empty for a platform host.
          type: string
        times:
          additionalProperties:
            format: date-time
            type:
              - string
              - "null"
          type: object
        versions:
          additionalProperties: {}
          type: object
      type: object
    HostDrain:
      additionalProperties: false
      properties:
        draining:
          type: boolean
        host:
          description: The host's id.
          type: string
      type: object
    HostList:
      additionalProperties: false
      properties:
        hosts:
          items:
            $ref: "#/components/schemas/Host"
          type:
            - array
            - "null"
      type: object
    HostPlacement:
      additionalProperties: false
      properties:
        epoch:
          format: int64
          type: integer
        resources:
          $ref: "#/components/schemas/Resources"
        runId:
          type: string
        runName:
          type: string
        since:
          format: date-time
          type: string
        state:
          type: string
        tenant:
          type: string
      type: object
    Image:
      additionalProperties: false
      properties:
        build:
          $ref: "#/components/schemas/Build"
        ref:
          type: string
        registryAuth:
          description: Credentials for private registries, used by the runner for every pull and push of the placement (image.ref, FROM bases, the build cache). Never in the container.
          items:
            $ref: "#/components/schemas/RegistryAuth"
          type:
            - array
            - "null"
      type: object
    ImageResolution:
      additionalProperties: false
      properties:
        containerfile:
          type: string
        imageId:
          type: string
      type: object
    Init:
      additionalProperties: false
      properties:
        script:
          type: string
      type: object
    InputRequest:
      additionalProperties: false
      properties:
        interrupt:
          description: Stop the current turn first.
          type: boolean
        raw:
          contentEncoding: base64
          description: Raw bytes for a generic workload's stdin.
          type: string
        requestId:
          description: "Makes retries safe: the runner delivers each id once. Generated if absent."
          type: string
        text:
          description: "A message: agents get it as a prompt, generic workloads on stdin."
          type: string
      type: object
    ListRunsBody:
      additionalProperties: false
      properties:
        runs:
          items:
            $ref: "#/components/schemas/Run"
          type:
            - array
            - "null"
      type: object
    MCPHeader:
      additionalProperties: false
      properties:
        name:
          description: The HTTP header's name, e.g. Authorization.
          type: string
        secret:
          description: The secret (in secrets) whose value is the header's whole value, e.g. "Bearer …".
          type: string
      type: object
    MCPServer:
      additionalProperties: false
      properties:
        headers:
          description: Headers sent on every request, each valued from a secret (the agent then holds them; prefer service).
          items:
            $ref: "#/components/schemas/MCPHeader"
          type:
            - array
            - "null"
        name:
          description: Unique name; the agent sees its tools under it. Lowercase letters, digits, - and _.
          type: string
        path:
          description: "With service: the MCP endpoint's path, appended to the service's URL (default: none, the URL itself)."
          type: string
        service:
          description: "A workload.services entry with loopback: the agent is given its loopback address, and the service adds the headers, so the agent never holds them. Instead of url and headers."
          type: string
        url:
          description: "The server's streamable HTTP endpoint: http or https, without credentials. Or service instead."
          type: string
      type: object
    Manifest:
      additionalProperties: false
      properties:
        epoch:
          format: int64
          type: integer
        runId:
          type: string
        sessionId:
          type: string
        snapshotId:
          type: string
        volumes:
          items:
            $ref: "#/components/schemas/VolumeSnapshot"
          type:
            - array
            - "null"
      type: object
    MigrateRequest:
      additionalProperties: false
      properties:
        input:
          $ref: "#/components/schemas/ResumeInput"
          description: A message for the workload once it runs again.
        to:
          description: The host to move to (id or name); by default, any other.
          type: string
      type: object
    Network:
      additionalProperties: false
      properties:
        egress:
          items:
            $ref: "#/components/schemas/EgressRule"
          type:
            - array
            - "null"
        ports:
          items:
            $ref: "#/components/schemas/Port"
          type:
            - array
            - "null"
        unrestricted:
          type: boolean
      type: object
    OutputEnd:
      additionalProperties: false
      properties:
        afterEvent:
          description: The last lifecycle event sent (afterEvent).
          format: int64
          type: integer
        cursor:
          description: Where to resume (since).
          type: string
        state:
          description: The Run's state.
          type: string
      type: object
    OutputError:
      additionalProperties: false
      properties:
        error:
          type: string
      type: object
    OutputGap:
      additionalProperties: false
      properties:
        epoch:
          format: int64
          type: integer
        reason:
          type: string
      type: object
    OutputRecord:
      additionalProperties: false
      properties:
        ch:
          type: string
        cursor:
          type: string
        data:
          type: string
        epoch:
          format: int64
          type: integer
        event: {}
        seq:
          format: int64
          type: integer
        t:
          format: int64
          type: integer
      type: object
    Percentiles:
      additionalProperties: false
      properties:
        max:
          format: double
          type: number
        "n":
          format: int64
          type: integer
        p50:
          format: double
          type: number
        p95:
          format: double
          type: number
      type: object
    Placement:
      additionalProperties: false
      properties:
        pool:
          type: string
        prefers:
          additionalProperties:
            type: string
          type: object
        requires:
          additionalProperties:
            type: string
          type: object
      type: object
    Pool:
      additionalProperties: false
      properties:
        maxHosts:
          format: int64
          type: integer
        minHosts:
          format: int64
          type: integer
        name:
          type: string
        platform:
          type: boolean
        provider:
          type: string
        scaleDownAfter:
          description: "How long a provisioned host stays idle before it is released, e.g. 600s; empty: luxd's scale_down_after (default 10m)."
          oneOf:
            - examples:
                - 4h
              type: string
            - type: number
        shared:
          type: boolean
        template:
          additionalProperties: {}
          type: object
        tenant:
          description: The owning tenant's name; empty for a platform pool.
          readOnly: true
          type: string
        warmHosts:
          format: int64
          type: integer
        warmWhileActive:
          description: Keep warmHosts only while the pool is in use (a Run placed or ended within scaleDownAfter, or one waiting); an idle pool scales down to minHosts.
          type: boolean
      type: object
    PoolList:
      additionalProperties: false
      properties:
        pools:
          items:
            $ref: "#/components/schemas/Pool"
          type:
            - array
            - "null"
      type: object
    Port:
      additionalProperties: false
      properties:
        name:
          type: string
        port:
          format: int64
          type: integer
      type: object
    Push:
      additionalProperties: false
      properties:
        branch:
          type: string
      type: object
    PushRequest:
      additionalProperties: false
      properties:
        expect:
          additionalProperties:
            type: string
          description: Per repository name, the commit (full id) the push branch must be at for the push to go ahead.
          type: object
        requestId:
          description: Names the push in its git.push event. Generated if absent.
          type: string
      type: object
    RegistryAuth:
      additionalProperties: false
      properties:
        registry:
          description: "The registry's host, with an optional port: ghcr.io, 123.dkr.ecr.eu-west-1.amazonaws.com, 10.0.0.5:5000. No scheme or path."
          type: string
        secret:
          description: The secret (in secrets) holding user:password, or a bare token (sent as the password, with the user lux).
          type: string
      type: object
    Repository:
      additionalProperties: false
      properties:
        addedBy:
          description: "Set by luxd: the resume request that added it."
          type: string
        credential:
          type: string
        name:
          type: string
        path:
          type: string
        push:
          type: boolean
        ref:
          type: string
        url:
          type: string
      type: object
    RequestAccepted:
      additionalProperties: false
      properties:
        requestId:
          type: string
      type: object
    Resources:
      additionalProperties: false
      properties:
        cpus:
          format: double
          type: number
        disk:
          description: "A number of bytes, or a size: \"8Gi\", \"512Mi\", \"1G\". Responses carry the number."
          oneOf:
            - format: int64
              type: integer
            - examples:
                - 8Gi
              type: string
        memory:
          description: "A number of bytes, or a size: \"8Gi\", \"512Mi\", \"1G\". Responses carry the number."
          oneOf:
            - format: int64
              type: integer
            - examples:
                - 8Gi
              type: string
        pids:
          format: int64
          type: integer
      type: object
    Resumability:
      additionalProperties: false
      properties:
        blockers:
          items:
            type: string
          type:
            - array
            - "null"
        onHosts:
          items:
            type: string
          type:
            - array
            - "null"
        secrets:
          items:
            type: string
          type:
            - array
            - "null"
        secretsHeld:
          type: boolean
        snapshot:
          type: string
        uploaded:
          type: boolean
      type: object
    Resume:
      additionalProperties: false
      properties:
        command:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    ResumeGit:
      additionalProperties: false
      properties:
        repositories:
          description: As in the spec's git.repositories; names must be new. A credential the spec does not declare becomes a secret used only by the runner, and its value must be in secrets.
          items:
            $ref: "#/components/schemas/Repository"
          type:
            - array
            - "null"
      type: object
    ResumeInput:
      additionalProperties: false
      properties:
        text:
          type: string
      type: object
    ResumeRequest:
      additionalProperties: false
      properties:
        fromSnapshot:
          description: Resume from this snapshot instead of the latest (e.g. after lost).
          type: string
        git:
          $ref: "#/components/schemas/ResumeGit"
          description: Repositories to add. The runner clones them before the Run starts again; one whose clone fails is dropped and the Run goes on without it (a git.clone event says so).
        input:
          $ref: "#/components/schemas/ResumeInput"
          description: A message for the workload once it is back.
        requestId:
          description: "Names this resume: in its resume.requested event, in the addedBy of the repositories it adds and in their git.clone events. Generated if absent."
          type: string
        resources:
          $ref: "#/components/schemas/ResumeResources"
          description: Change what the Run gets from now on (e.g. more disk after it went over).
        secrets:
          description: "A value for every one of the Run's secrets, and for the credentials of repositories it adds: luxd never keeps them."
          items:
            $ref: "#/components/schemas/Secret"
          type:
            - array
            - "null"
        to:
          description: "Operators: place it on this host (id or name), and nowhere else."
          type: string
      type: object
    ResumeResources:
      additionalProperties: false
      properties:
        disk:
          description: "A new disk limit: its writable layer plus state volumes."
          oneOf:
            - format: int64
              type: integer
            - examples:
                - 8Gi
              type: string
      type: object
    Run:
      additionalProperties: false
      properties:
        activity:
          type: string
        createdAt:
          format: date-time
          type: string
        epoch:
          format: int64
          type: integer
        exitCode:
          format: int64
          type: integer
        finishedAt:
          format: date-time
          type: string
        firstScheduledAt:
          format: date-time
          type: string
        firstStartedAt:
          format: date-time
          type: string
        host:
          description: The name of the host of its current placement.
          type: string
        hostId:
          description: That host's id.
          type: string
        id:
          type: string
        image:
          $ref: "#/components/schemas/ImageResolution"
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        placements:
          items:
            $ref: "#/components/schemas/RunPlacement"
          type:
            - array
            - "null"
        resume:
          $ref: "#/components/schemas/Resumability"
        secrets:
          items:
            $ref: "#/components/schemas/SecretRef"
          type:
            - array
            - "null"
        sessionId:
          type: string
        snapshotId:
          type: string
        spec:
          $ref: "#/components/schemas/RunSpec"
        state:
          type: string
        stateReason:
          type: string
        tenant:
          description: The owning tenant's name.
          type: string
        usage:
          $ref: "#/components/schemas/RunUsage"
      type: object
    RunPlacement:
      additionalProperties: false
      properties:
        acceptedAt:
          format: date-time
          type: string
        assignedAt:
          format: date-time
          type: string
        containerStartedAt:
          format: date-time
          type: string
        cpuSeconds:
          format: double
          type: number
        epoch:
          format: int64
          type: integer
        exitCode:
          format: int64
          type: integer
        exitReason:
          type: string
        exitedAt:
          format: date-time
          type: string
        host:
          type: string
        hostName:
          type: string
        imageReadyAt:
          format: date-time
          type: string
        netRxBytes:
          format: int64
          type: integer
        netTxBytes:
          format: int64
          type: integer
        peakDiskBytes:
          format: int64
          type: integer
        peakMemoryBytes:
          format: int64
          type: integer
        peakPids:
          format: int64
          type: integer
        snapshotBytes:
          format: int64
          type: integer
        snapshotDoneAt:
          format: date-time
          type: string
        state:
          type: string
        stopReason:
          type: string
        stopRequestedAt:
          format: date-time
          type: string
        uploadedAt:
          format: date-time
          type: string
        volumesRestoredAt:
          format: date-time
          type: string
        workloadStartedAt:
          format: date-time
          type: string
      type: object
    RunSpec:
      additionalProperties: false
      properties:
        artifacts:
          $ref: "#/components/schemas/Artifacts"
        env:
          additionalProperties:
            type: string
          type: object
        git:
          $ref: "#/components/schemas/Git"
        image:
          $ref: "#/components/schemas/Image"
        init:
          $ref: "#/components/schemas/Init"
        labels:
          additionalProperties:
            type: string
          type: object
        name:
          type: string
        network:
          $ref: "#/components/schemas/Network"
        placement:
          $ref: "#/components/schemas/Placement"
        resources:
          $ref: "#/components/schemas/Resources"
          description: "What the Run gets, and the scheduler reserves on its host. Unset fields take luxd's defaults: cpus 2, memory 8Gi, disk 20Gi, pids 1024, unless its operator changed them (LUX_DEFAULT_CPUS, LUX_DEFAULT_MEMORY, LUX_DEFAULT_DISK, LUX_DEFAULT_PIDS). disk bounds the writable layer plus state volumes: a Run over it is stopped and fails."
        sandbox:
          $ref: "#/components/schemas/Sandbox"
        secrets:
          items:
            $ref: "#/components/schemas/Secret"
          type:
            - array
            - "null"
        timeout:
          description: "The most time the Run may spend running, summed over its placements (time stopped, lost, or waiting for a host does not count). Past it, the Run is stopped and fails. Unset: no limit."
          oneOf:
            - examples:
                - 4h
              type: string
            - type: number
        volumes:
          items:
            $ref: "#/components/schemas/Volume"
          type:
            - array
            - "null"
        workload:
          $ref: "#/components/schemas/Workload"
      type: object
    RunUsage:
      additionalProperties: false
      properties:
        cpuSeconds:
          format: double
          type: number
        netRxBytes:
          format: int64
          type: integer
        netTxBytes:
          format: int64
          type: integer
        peakDiskBytes:
          format: int64
          type: integer
        peakMemoryBytes:
          format: int64
          type: integer
        peakPids:
          format: int64
          type: integer
        placements:
          format: int64
          type: integer
        queueSeconds:
          format: double
          type: number
      type: object
    Sample:
      additionalProperties: false
      properties:
        allocCpus:
          format: double
          type: number
        allocMemory:
          format: int64
          type: integer
        allocatedCpus:
          format: double
          type: number
        allocatedMemory:
          format: int64
          type: integer
        at:
          format: date-time
          type: string
        busy:
          format: int64
          type: integer
        capacityCpus:
          format: double
          type: number
        capacityMemory:
          format: int64
          type: integer
        cpuCores:
          format: double
          type: number
        diskBytes:
          format: int64
          type: integer
        epoch:
          format: int64
          type: integer
        finished:
          format: int64
          type: integer
        hosts:
          additionalProperties:
            format: int64
            type: integer
          type: object
        idle:
          format: int64
          type: integer
        memoryBytes:
          format: int64
          type: integer
        netRxRate:
          format: double
          type: number
        netTxRate:
          format: double
          type: number
        pids:
          format: int64
          type: integer
        placements:
          format: int64
          type: integer
        queued:
          format: int64
          type: integer
        runs:
          additionalProperties:
            format: int64
            type: integer
          type: object
        startP50:
          format: double
          type: number
        startP95:
          format: double
          type: number
        started:
          format: int64
          type: integer
      type: object
    Sandbox:
      additionalProperties: false
      properties:
        nestedContainers:
          type: boolean
        readOnlyRoot:
          type: boolean
      type: object
    Secret:
      additionalProperties: false
      properties:
        as:
          type: string
        name:
          type: string
        path:
          type: string
        runnerOnly:
          type: boolean
        value:
          type: string
      type: object
    SecretRef:
      additionalProperties: false
      properties:
        fingerprint:
          type: string
        name:
          type: string
      type: object
    Service:
      additionalProperties: false
      properties:
        headers:
          description: Headers set on every request (replacing the workload's own of the same name), each valued from a secret.
          items:
            $ref: "#/components/schemas/MCPHeader"
          type:
            - array
            - "null"
        loopback:
          description: Also serve it on http://127.0.0.1:<port> inside the Run (LUX_SERVICE_<NAME>_URL), for clients that need a URL; an mcpServers entry can then name it.
          type: boolean
        name:
          description: "Unique name: the socket is /.lux/services/<name>.sock. Lowercase letters, digits, - and _."
          type: string
        url:
          description: "Where requests go: http or https, without credentials. A request's path is appended to this URL's."
          type: string
      type: object
    Snapshot:
      additionalProperties: false
      properties:
        available:
          type: boolean
        createdAt:
          format: date-time
          type: string
        epoch:
          format: int64
          type: integer
        id:
          type: string
        manifest:
          $ref: "#/components/schemas/Manifest"
        onHost:
          type: string
        uploaded:
          type: boolean
      type: object
    SnapshotList:
      additionalProperties: false
      properties:
        snapshots:
          items:
            $ref: "#/components/schemas/Snapshot"
          type:
            - array
            - "null"
      type: object
    Status:
      additionalProperties: false
      properties:
        allocated:
          $ref: "#/components/schemas/Totals"
        busy:
          format: int64
          type: integer
        capacity:
          $ref: "#/components/schemas/Totals"
        hosts:
          additionalProperties:
            format: int64
            type: integer
          type: object
        idle:
          format: int64
          type: integer
        oldestQueuedAt:
          format: date-time
          type: string
        queued:
          format: int64
          type: integer
        runs:
          additionalProperties:
            format: int64
            type: integer
          type: object
        startLatency:
          $ref: "#/components/schemas/Percentiles"
      type: object
    StatusBody:
      additionalProperties: false
      properties:
        status:
          examples:
            - ok
          type: string
      type: object
    StreamData:
      additionalProperties: false
      properties:
        ch:
          type: string
        cols:
          format: int64
          type: integer
        data:
          contentEncoding: base64
          type: string
        eof:
          type: boolean
        error:
          type: string
        exitCode:
          format: int64
          type: integer
        rows:
          format: int64
          type: integer
      type: object
    StreamOpen:
      additionalProperties: false
      properties:
        cols:
          format: int64
          type: integer
        command:
          items:
            type: string
          type:
            - array
            - "null"
        kind:
          type: string
        port:
          format: int64
          type: integer
        rows:
          format: int64
          type: integer
        streamId:
          type: string
        tty:
          type: boolean
      type: object
    Tenant:
      additionalProperties: false
      properties:
        activeRuns:
          format: int64
          type: integer
        createdAt:
          format: date-time
          type: string
        hosts:
          format: int64
          type: integer
        id:
          type: string
        maxConcurrentRuns:
          format: int64
          type: integer
        maxHosts:
          format: int64
          type: integer
        maxStorageBytes:
          format: int64
          type: integer
        name:
          type: string
        retentionDays:
          format: int64
          type: integer
        runs:
          format: int64
          type: integer
        storedBytes:
          format: int64
          type: integer
      type: object
    TenantList:
      additionalProperties: false
      properties:
        tenants:
          items:
            $ref: "#/components/schemas/Tenant"
          type:
            - array
            - "null"
      type: object
    Totals:
      additionalProperties: false
      properties:
        cpus:
          format: double
          type: number
        disk:
          format: int64
          type: integer
        memory:
          format: int64
          type: integer
        runs:
          format: int64
          type: integer
      type: object
    Volume:
      additionalProperties: false
      properties:
        kind:
          type: string
        name:
          type: string
        path:
          type: string
      type: object
    VolumeSnapshot:
      additionalProperties: false
      properties:
        blobId:
          type: string
        name:
          type: string
        path:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
      type: object
    Whoami:
      additionalProperties: false
      properties:
        consoleAuth:
          type: string
        email:
          type: string
        keyId:
          type: string
        name:
          type: string
        operator:
          type: boolean
        scopes:
          items:
            type: string
          type:
            - array
            - "null"
        tenant:
          description: The key's tenant's name; empty for an operator key.
          type: string
        tenantId:
          type: string
      type: object
    Workload:
      additionalProperties: false
      properties:
        adapter:
          type: string
        command:
          items:
            type: string
          type:
            - array
            - "null"
        grace:
          description: A Go duration ("4h", "90s"), or a number of seconds. Responses carry the string.
          oneOf:
            - examples:
                - 4h
              type: string
            - type: number
        mcpServers:
          description: MCP servers (streamable HTTP) the agent connects to, through its adapter. Each URL's host must be allowed by network.egress (unless unrestricted), and may not be the control plane's.
          items:
            $ref: "#/components/schemas/MCPServer"
          type:
            - array
            - "null"
        prompt:
          type: string
        resume:
          $ref: "#/components/schemas/Resume"
        services:
          description: "HTTP services the workload calls through a local socket (/.lux/services/<name>.sock, named in LUX_SERVICE_<NAME>), which adds their headers: the workload never holds the credentials. Same URL rules as mcpServers."
          items:
            $ref: "#/components/schemas/Service"
          type:
            - array
            - "null"
        tty:
          type: boolean
        user:
          type: string
        workdir:
          type: string
      type: object
  securitySchemes:
    apiKey:
      description: A tenant API key (luxd admin create-key), or an operator key (luxd admin create-operator-key).
      scheme: bearer
      type: http
info:
  description: |-
    The lux tenant API. Every /v1 call authenticates with an API key (`Authorization: Bearer <key>`); a key has scopes `read`, `run` and `admin`, each implying the ones before it.

    An operator key (`luxd admin create-operator-key`, scope `operator`) belongs to no tenant: it sees and acts on every tenant through the same operations. A Run's operations act in the Run's own tenant; lists span every tenant unless `?tenant=` (an id or a name) narrows them; creating needs `?tenant=`.

    Errors are JSON: `{"error": {"code": "not_found", "message": "...", "details": ["..."]}}`, with a stable `code`.
  title: lux
  version: dev
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Check luxd is up
  /v1/artifacts/{aid}:
    get:
      description: |-
        The file the Run wrote, streamed through luxd. Content-Length and X-Lux-SHA256 let a client tell a whole download from one cut short (the response is aborted, never ended cleanly, on a failure mid-way). 409 not_uploaded (with Retry-After) while it is still on its host; 410 gone once deleted by retention.

        Needs the `read` scope.
      operationId: downloadArtifact
      parameters:
        - description: The artifact's id.
          in: path
          name: aid
          required: true
          schema:
            description: The artifact's id.
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The file.
          headers:
            Content-Disposition:
              description: attachment, with the file's name.
              schema:
                type: string
            Content-Length:
              description: The file's size.
              schema:
                type: integer
            X-Lux-SHA256:
              description: The file's SHA-256, hex.
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gone
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Download an artifact
      tags:
        - runs
  /v1/events:
    get:
      description: |-
        Server-sent events: one `lux` event per Run event, oldest first, each with its id (`id:`, and resume with Last-Event-ID or `after`). From now, from `after`, or the `last` N; with `follow=false` the stream ends after what is there now.

        Needs the `read` scope.
      operationId: eventFeed
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: "From after this event id (default: from now)."
          explode: false
          in: query
          name: after
          schema:
            description: "From after this event id (default: from now)."
            type: string
        - description: Start with the last N events (at most 500), instead of from now.
          explode: false
          in: query
          name: last
          schema:
            description: Start with the last N events (at most 500), instead of from now.
            format: int64
            type: integer
        - description: "false: end after what there is now."
          explode: false
          in: query
          name: follow
          schema:
            description: "false: end after what there is now."
            type: string
        - description: "A reconnecting client's last event id: resumes after it."
          in: header
          name: Last-Event-ID
          schema:
            description: "A reconnecting client's last event id: resumes after it."
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: "Server-sent events: `event: <type>` and `data: <JSON>` lines, each event ended by a blank line."
                items:
                  oneOf:
                    - description: A Run's event.
                      properties:
                        data:
                          $ref: "#/components/schemas/FeedEvent"
                        event:
                          const: lux
                          type: string
                      required:
                        - event
                        - data
                      title: lux
                      type: object
                    - description: The stream failed.
                      properties:
                        data:
                          $ref: "#/components/schemas/OutputError"
                        event:
                          const: error
                          type: string
                      required:
                        - event
                        - data
                      title: error
                      type: object
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Every Run's events, as they happen
      tags:
        - runs
  /v1/history:
    get:
      description: |-
        Samples of what GET /v1/status reports.

        Needs the `read` scope.
      operationId: history
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: "How far back from now: a Go duration or a number of days (7d). Default 1h."
          explode: false
          in: query
          name: since
          schema:
            description: "How far back from now: a Go duration or a number of days (7d). Default 1h."
            examples:
              - 24h
            type: string
        - description: The start (RFC 3339), instead of since.
          explode: false
          in: query
          name: from
          schema:
            description: The start (RFC 3339), instead of since.
            type: string
        - description: The end (RFC 3339); default now.
          explode: false
          in: query
          name: to
          schema:
            description: The end (RFC 3339); default now.
            type: string
        - description: "Resolution in seconds: 0 (raw), 60 or 3600. Default: the finest kept for the range."
          explode: false
          in: query
          name: res
          schema:
            description: "Resolution in seconds: 0 (raw), 60 or 3600. Default: the finest kept for the range."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: The state of the system over time
      tags:
        - history
  /v1/hosts:
    get:
      description: |-
        The tenant's own hosts, and platform hosts in pools it can use. Operators: every host.

        Needs the `read` scope.
      operationId: listHosts
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: true to include terminated hosts.
          explode: false
          in: query
          name: all
          schema:
            description: true to include terminated hosts.
            examples:
              - "true"
            type: string
        - description: Only this pool's hosts.
          explode: false
          in: query
          name: pool
          schema:
            description: Only this pool's hosts.
            type: string
        - description: "Only hosts in this state: provisioning, ready, draining, lost or terminated."
          explode: false
          in: query
          name: state
          schema:
            description: "Only hosts in this state: provisioning, ready, draining, lost or terminated."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: List hosts
      tags:
        - hosts
  /v1/hosts/{id}:
    get:
      description: |-
        With its live placements.

        Needs the `read` scope.
      operationId: getHost
      parameters:
        - description: The host's id or name (a name of a host that is not terminated).
          in: path
          name: id
          required: true
          schema:
            description: The host's id or name (a name of a host that is not terminated).
            type: string
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Host"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Get a host
      tags:
        - hosts
  /v1/hosts/{id}/drain:
    post:
      description: |-
        No new placements; its live Runs finish where they are. With forceEvict, they are also stopped and resumed elsewhere (also applies to a host that is already draining). Only the tenant's own hosts; operators, any host.

        Needs the `admin` scope.
      operationId: drainHost
      parameters:
        - description: The host's id or name (a name of a host that is not terminated).
          in: path
          name: id
          required: true
          schema:
            description: The host's id or name (a name of a host that is not terminated).
            type: string
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrainHostRequest"
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HostDrain"
          description: Accepted
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Drain a host
      tags:
        - hosts
  /v1/hosts/{id}/history:
    get:
      description: |-
        CPU cores and memory in use, disk used, and its live placements and what they asked for. A tenant sees its own hosts' history only.

        Needs the `read` scope.
      operationId: hostHistory
      parameters:
        - description: The host's id or name (a name of a host that is not terminated).
          in: path
          name: id
          required: true
          schema:
            description: The host's id or name (a name of a host that is not terminated).
            type: string
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: "How far back from now: a Go duration or a number of days (7d). Default 1h."
          explode: false
          in: query
          name: since
          schema:
            description: "How far back from now: a Go duration or a number of days (7d). Default 1h."
            examples:
              - 24h
            type: string
        - description: The start (RFC 3339), instead of since.
          explode: false
          in: query
          name: from
          schema:
            description: The start (RFC 3339), instead of since.
            type: string
        - description: The end (RFC 3339); default now.
          explode: false
          in: query
          name: to
          schema:
            description: The end (RFC 3339); default now.
            type: string
        - description: "Resolution in seconds: 0 (raw), 60 or 3600. Default: the finest kept for the range."
          explode: false
          in: query
          name: res
          schema:
            description: "Resolution in seconds: 0 (raw), 60 or 3600. Default: the finest kept for the range."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/History"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: A host's resource use over time
      tags:
        - history
  /v1/pools:
    get:
      description: |-
        The tenant's pools and the platform pools it can use. Operators: every pool.

        Needs the `read` scope.
      operationId: listPools
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PoolList"
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: List pools
      tags:
        - pools
    post:
      description: Needs the `admin` scope.
      operationId: putPool
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pool"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pool"
          description: OK
          headers:
            Tenant:
              schema:
                description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Create or update a pool
      tags:
        - pools
  /v1/pools/{name}:
    delete:
      description: |-
        Its provisioned hosts are cordoned and terminated once idle; its Runs wait for a pool of that name again. forceEvict also stops its hosts' live Runs so they resume elsewhere.

        Needs the `admin` scope.
      operationId: deletePool
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: The pool's name.
          in: path
          name: name
          required: true
          schema:
            description: The pool's name.
            type: string
        - description: Also stop this pool's live Runs so they resume elsewhere, instead of finishing where they are.
          explode: false
