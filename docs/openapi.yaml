components:
  schemas:
    Artifact:
      additionalProperties: false
      properties:
        available:
          type: boolean
        contentType:
          type: string
        createdAt:
          format: date-time
          type: string
        epoch:
          format: int64
          type: integer
        id:
          type: string
        path:
          type: string
        sha256:
          type: string
        size:
          format: int64
          type: integer
      type: object
    ArtifactList:
      additionalProperties: false
      properties:
        artifacts:
          items:
            $ref: "#/components/schemas/Artifact"
          type:
            - array
            - "null"
      type: object
    Artifacts:
      additionalProperties: false
      properties:
        paths:
          items:
            type: string
          type:
            - array
            - "null"
      type: object
    BeforeStop:
      additionalProperties: false
      properties:
        command:
          description: argv; run with the workload's PATH
          items:
            type: string
          type:
            - array
            - "null"
        timeout:
          description: default 10s; at most the workload's grace
          oneOf:
            - examples:
                - 4h
              type: string
            - type: number
      type: object
    Build:
      additionalProperties: false
      properties:
        args:
          additionalProperties:
            type: string
          type: object
        cache:
          description: "A registry repository (no tag), e.g. registry.example.com/team/lux-cache, shared by hosts: a host pulls <cache>:<build key> instead of building, and pushes what it builds there. The key covers the tenant, egress rules, pinned Containerfile and args."
          type: string
        containerfile:
          type: string
        context:
          type: string
      type: object
    Capacity:
      additionalProperties: false
      properties:
        cpus:
          format: double
          type: number
        disk:
          format: int64
          type: integer
        memory:
          format: int64
          type: integer
        runs:
          format: int64
          type: integer
      type: object
    Control:
      additionalProperties: false
      properties:
        luxd:
          description: A series per luxd process (a restart is a new one), oldest first.
          items:
            $ref: "#/components/schemas/LuxdSeries"
          type:
            - array
            - "null"
        machines:
          description: A series per machine luxd ran on (by hostname), oldest first.
          items:
            $ref: "#/components/schemas/MachineSeries"
          type:
            - array
            - "null"
        postgres:
          description: "lux's Postgres database: one series, whichever luxd sampled it."
          items:
            $ref: "#/components/schemas/PostgresPoint"
          type:
            - array
            - "null"
      type: object
    CostFamilyInfo:
      additionalProperties: false
      properties:
        color:
          type: string
        displayName:
          type: string
        family:
          type: string
      type: object
    CostLine:
      additionalProperties: false
      properties:
        amount:
          description: A decimal string, up to 9 fractional digits; may be negative (a refund).
          examples:
            - "1.28431"
          type: string
        currency:
          description: As reported (ISO 4217); never converted.
          examples:
            - USD
          type: string
        details:
          additionalProperties: {}
          type: object
        family:
          description: "Free-form: compute, ai, video, ..."
          type: string
        final:
          description: "false: an estimate that may still change."
          type: boolean
        from:
          description: Start of the time window the line covers.
          format: date-time
          type: string
        item:
          description: Empty when the source gives none.
          type: string
        reportedAt:
          format: date-time
          type: string
        runId:
          type: string
        source:
          description: compute, or a cost plugin's configured name.
          type: string
        to:
          format: date-time
          type: string
      type: object
    CostRunInfo:
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
      type: object
    CostSource:
      additionalProperties: false
      properties:
        answeredAt:
          format: date-time
          type: string
        nextAt:
          format: date-time
          type: string
        source:
          type: string
        status:
          enum:
            - ok
            - incomplete
            - final
          type: string
      type: object
    CostSummaryBody:
      additionalProperties: false
      properties:
        basis:
          type: string
        families:
          description: "Grouped by family: each family in totals, with the displayName and color byFamily has on a Run's cost."
          items:
            $ref: "#/components/schemas/CostFamilyInfo"
          type:
            - array
            - "null"
        from:
          format: date-time
          type: string
        hosts:
          items:
            $ref: "#/components/schemas/HostAllocation"
          type:
            - array
            - "null"
        runs:
          description: "Grouped by run: each Run in totals with its name."
          items:
            $ref: "#/components/schemas/CostRunInfo"
          type:
            - array
            - "null"
        series:
          items:
            $ref: "#/components/schemas/CostSummaryRow"
          type:
            - array
            - "null"
        to:
          format: date-time
          type: string
        totals:
          items:
            $ref: "#/components/schemas/CostSummaryRow"
          type:
            - array
            - "null"
        unallocated:
          items:
            $ref: "#/components/schemas/CostSummaryRow"
          type:
            - array
            - "null"
      type: object
    CostSummaryRow:
      additionalProperties: false
      properties:
        amount:
          type: string
        at:
          format: date-time
          type: string
        currency:
          type: string
        group:
          additionalProperties:
            type: string
          type: object
      type: object
    CostTotal:
      additionalProperties: false
      properties:
        amount:
          description: final + estimate.
          type: string
        color:
          description: In byFamily when a plugin supplies a color hint.
          type: string
        currency:
          type: string
        displayName:
          description: In byFamily when the family is described by a plugin or is compute.
          type: string
        estimate:
          description: The part from lines that may still change.
          type: string
        family:
          description: In byFamily only.
          type: string
        final:
          description: The part from final lines.
          type: string
      type: object
    DiffFileStat:
      additionalProperties: false
      properties:
        binary:
          type: boolean
        deletions:
          format: int64
          type: integer
        insertions:
          format: int64
          type: integer
        name:
          type: string
      type: object
    DiskSample:
      additionalProperties: false
      properties:
        freeBytes:
          description: What an unprivileged process can still write.
          format: int64
          type: integer
        path:
          type: string
        totalBytes:
          format: int64
          type: integer
        usedBytes:
          format: int64
          type: integer
      type: object
    DrainHostRequest:
      additionalProperties: false
      properties:
        forceEvict:
          description: Also stop this host's live Runs so they resume elsewhere. Without it, they finish where they are; only new placements are refused.
          type: boolean
      type: object
    EgressRule:
      additionalProperties: false
      properties:
        cidr:
          type: string
        host:
          type: string
      type: object
    Error:
      additionalProperties: false
      properties:
        error:
          $ref: "#/components/schemas/ErrorInfo"
      type: object
    ErrorInfo:
      additionalProperties: false
      properties:
        code:
          description: Stable error code, e.g. not_found, invalid_spec, quota_exceeded.
          type: string
        details:
          description: Every problem, when there are several (invalid_spec, secrets_required, validation).
          items:
            type: string
          type:
            - array
            - "null"
        message:
          type: string
      type: object
    Event:
      additionalProperties: false
      properties:
        data:
          additionalProperties: {}
          type: object
        epoch:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        time:
          format: date-time
          type: string
        type:
          type: string
      type: object
    EventList:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/Event"
          type:
            - array
            - "null"
      type: object
    FeedEvent:
      additionalProperties: false
      properties:
        data:
          additionalProperties: {}
          type: object
        epoch:
          format: int64
          type: integer
        id:
          format: int64
          type: integer
        runId:
          type: string
        tenant:
          type: string
        time:
          format: date-time
          type: string
        type:
          type: string
      type: object
    Git:
      additionalProperties: false
      properties:
        push:
          $ref: "#/components/schemas/Push"
        repositories:
          items:
            $ref: "#/components/schemas/Repository"
          type:
            - array
            - "null"
      type: object
    History:
      additionalProperties: false
      properties:
        control:
          $ref: "#/components/schemas/Control"
          description: The machines luxd runs on, its Postgres, and each luxd process. Only an operator key reading the whole system (no tenant) gets it.
        from:
          format: date-time
          type: string
        resolution:
          format: int64
          type: integer
        samples:
          items:
            $ref: "#/components/schemas/Sample"
          type:
            - array
            - "null"
        to:
          format: date-time
          type: string
      type: object
    Host:
      additionalProperties: false
      properties:
        allocated:
          $ref: "#/components/schemas/Resources"
        capacity:
          $ref: "#/components/schemas/Capacity"
        draining:
          type: boolean
        id:
          type: string
        instanceType:
          description: The instance type the provider launched; absent for a host that registered itself.
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
        lastHeartbeat:
          format: date-time
          type: string
        liveRuns:
          format: int64
          type: integer
        market:
          description: on-demand or spot, as the provider launched it.
          enum:
            - on-demand
            - spot
          type: string
        name:
          type: string
        placements:
          items:
            $ref: "#/components/schemas/HostPlacement"
          type:
            - array
            - "null"
        platform:
          type: boolean
        pool:
          type: string
        providerId:
          type: string
        state:
          type: string
        stateReason:
          type: string
        tenant:
          description: The owning tenant's name; empty for a platform host.
          type: string
        times:
          additionalProperties:
            format: date-time
            type:
              - string
              - "null"
          type: object
        versions:
          additionalProperties: {}
          type: object
        zone:
          description: The availability zone the provider launched it in.
          type: string
      type: object
    HostAllocation:
      additionalProperties: false
      properties:
        allocated:
          type: string
        currency:
          type: string
        hostId:
          type: string
        unallocated:
          type: string
      type: object
    HostCost:
      additionalProperties: false
      properties:
        basis:
          type: string
        from:
          format: date-time
          type: string
        hostId:
          type: string
        hours:
          items:
            $ref: "#/components/schemas/HostCostHour"
          type:
            - array
            - "null"
        rates:
          items:
            $ref: "#/components/schemas/HostCostRate"
          type:
            - array
            - "null"
        to:
          format: date-time
          type: string
      type: object
    HostCostHour:
      additionalProperties: false
      properties:
        allocated:
          type: string
        currency:
          type: string
        hour:
          format: date-time
          type: string
        unallocated:
          type: string
      type: object
    HostCostRate:
      additionalProperties: false
      properties:
        currency:
          type: string
        from:
          format: date-time
          type: string
        perHour:
          type: string
        source:
          type: string
        to:
          format: date-time
          type: string
      type: object
    HostDrain:
      additionalProperties: false
      properties:
        draining:
          type: boolean
        host:
          description: The host's id.
          type: string
      type: object
    HostList:
      additionalProperties: false
      properties:
        hosts:
          items:
            $ref: "#/components/schemas/Host"
          type:
            - array
            - "null"
      type: object
    HostPlacement:
      additionalProperties: false
      properties:
        epoch:
          format: int64
          type: integer
        resources:
          $ref: "#/components/schemas/Resources"
        runId:
          type: string
        runName:
          type: string
        since:
          format: date-time
          type: string
        state:
          type: string
        tenant:
          type: string
      type: object
    HostPrice:
      additionalProperties: false
      properties:
        currency:
          description: ISO 4217.
          examples:
            - USD
          type: string
        hourlyPrice:
          description: Per hour, a decimal string with up to 9 fractional digits.
          examples:
            - "0.40"
          type: string
      required:
        - hourlyPrice
        - currency
      type: object
    HostPriceSet:
      additionalProperties: false
      properties:
        currency:
          description: ISO 4217.
          examples:
            - USD
          type: string
        host:
          description: The host's id.
          type: string
        hourlyPrice:
          description: Per hour, a decimal string with up to 9 fractional digits.
          examples:
            - "0.40"
          type: string
      required:
        - hourlyPrice
        - currency
      type: object
    Image:
      additionalProperties: false
      properties:
        build:
          $ref: "#/components/schemas/Build"
        ref:
          type: string
        registryAuth:
          description: Credentials for private registries, used by the runner for every pull and push of the placement (image.ref, FROM bases, the build cache). Never in the container.
          items:
            $ref: "#/components/schemas/RegistryAuth"
          type:
            - array
            - "null"
      type: object
    ImageResolution:
      additionalProperties: false
      properties:
        containerfile:
          type: string
        imageId:
          type: string
      type: object
    Init:
      additionalProperties: false
      properties:
        script:
          type: string
      type: object
    InputRequest:
      additionalProperties: false
      properties:
        interrupt:
          description: Stop the current turn first.
          type: boolean
        raw:
          contentEncoding: base64
          description: Raw bytes for a generic workload's stdin.
          type: string
        requestId:
          description: "Makes retries safe: the runner delivers each id once. Generated if absent."
          type: string
        text:
          description: "A message: agents get it as a prompt, generic workloads on stdin."
          type: string
      type: object
    LifecycleEvent:
      additionalProperties: false
      properties:
        count:
          description: How many times it happened in a row (a failure repeated on every provisioner pass); 1 for most.
          format: int64
          type: integer
        data:
          additionalProperties: {}
          type: object
        id:
          format: int64
          type: integer
        lastTime:
          description: When it last happened, if more than once.
          format: date-time
          type: string
        time:
          description: When it (first) happened.
          format: date-time
          type: string
        type:
          type: string
      type: object
    LifecycleEventList:
      additionalProperties: false
      properties:
        events:
          items:
            $ref: "#/components/schemas/LifecycleEvent"
          type:
            - array
            - "null"
      type: object
    ListRunsBody:
      additionalProperties: false
      properties:
        runs:
          items:
            $ref: "#/components/schemas/Run"
          type:
            - array
            - "null"
      type: object
    LuxdSample:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        cpuCores:
          description: "CPU in use, in cores: a rate over the previous point of the same process."
          format: double
          type: number
        goroutines:
          format: int64
          type: integer
        heapBytes:
          description: Go heap objects, live or not yet swept.
          format: int64
          type: integer
        peakRssBytes:
          description: "The highest RSS since the previous sample (a rollup: in its interval)."
          format: int64
          type: integer
        rssBytes:
          format: int64
          type: integer
        started:
          description: "When the process started: a change is a restart."
          format: date-time
          type: string
      type: object
    LuxdSeries:
      additionalProperties: false
      properties:
        hostname:
          description: The machine it runs on.
          type: string
        instance:
          description: "The luxd process's id, new at each start (rows from before process ids: its hostname)."
          type: string
        samples:
          items:
            $ref: "#/components/schemas/LuxdSample"
          type:
            - array
            - "null"
      type: object
    MCPHeader:
      additionalProperties: false
      properties:
        name:
          description: The HTTP header's name, e.g. Authorization.
          type: string
        secret:
          description: The secret (in secrets) whose value is the header's whole value, e.g. "Bearer …".
          type: string
      type: object
    MCPServer:
      additionalProperties: false
      properties:
        headers:
          description: Headers sent on every request, each valued from a secret (the agent then holds them; prefer service).
          items:
            $ref: "#/components/schemas/MCPHeader"
          type:
            - array
            - "null"
        name:
          description: Unique name; the agent sees its tools under it. Lowercase letters, digits, - and _.
          type: string
        path:
          description: "With service: the MCP endpoint's path, appended to the service's URL (default: none, the URL itself)."
          type: string
        service:
          description: "A workload.services entry with loopback: the agent is given its loopback address, and the service adds the headers, so the agent never holds them. Instead of url and headers."
          type: string
        url:
          description: "The server's streamable HTTP endpoint: http or https, without credentials. Or service instead."
          type: string
      type: object
    MachinePoint:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        cpuCores:
          description: "CPU in use, in cores: a rate over the machine's previous point."
          format: double
          type: number
        cpus:
          description: Cores on the machine.
          format: int64
          type: integer
        disks:
          description: Each tracked directory's filesystem (history.disk_paths).
          items:
            $ref: "#/components/schemas/DiskSample"
          type:
            - array
            - "null"
        memoryBytes:
          format: int64
          type: integer
        memoryTotal:
          format: int64
          type: integer
      type: object
    MachineSeries:
      additionalProperties: false
      properties:
        hostname:
          type: string
        samples:
          items:
            $ref: "#/components/schemas/MachinePoint"
          type:
            - array
            - "null"
      type: object
    Manifest:
      additionalProperties: false
      properties:
        epoch:
          format: int64
          type: integer
        runId:
          type: string
        sessionId:
          type: string
        snapshotId:
          type: string
        volumes:
          items:
            $ref: "#/components/schemas/VolumeSnapshot"
          type:
            - array
            - "null"
      type: object
    MigrateRequest:
      additionalProperties: false
      properties:
        input:
          $ref: "#/components/schemas/ResumeInput"
          description: A message for the workload once it runs again.
        to:
          description: The host to move to (id or name); by default, any other.
          type: string
      type: object
    Network:
      additionalProperties: false
      properties:
        egress:
          items:
            $ref: "#/components/schemas/EgressRule"
          type:
            - array
            - "null"
        ports:
          items:
            $ref: "#/components/schemas/Port"
          type:
            - array
            - "null"
        unrestricted:
          type: boolean
      type: object
    OutputEnd:
      additionalProperties: false
      properties:
        afterEvent:
          description: The last lifecycle event sent (afterEvent).
          format: int64
          type: integer
        cursor:
          description: Where to resume (since).
          type: string
        state:
          description: The Run's state.
          type: string
      type: object
    OutputError:
      additionalProperties: false
      properties:
        error:
          type: string
      type: object
    OutputGap:
      additionalProperties: false
      properties:
        epoch:
          format: int64
          type: integer
        reason:
          type: string
      type: object
    OutputRecord:
      additionalProperties: false
      properties:
        ch:
          description: "stdout, stderr, event, or server (a server's output: with servers=true or server=)."
          type: string
        cursor:
          type: string
        data:
          type: string
        epoch:
          format: int64
          type: integer
        event: {}
        seq:
          format: int64
          type: integer
        server:
          description: "ch=server: the server whose command wrote it."
          type: string
        stream:
          description: "ch=server: stdout or stderr (none: its start or exit, as event)."
          type: string
        t:
          format: int64
          type: integer
      type: object
    Percentiles:
      additionalProperties: false
      properties:
        max:
          format: double
          type: number
        "n":
          format: int64
          type: integer
        p50:
          format: double
          type: number
        p95:
          format: double
          type: number
      type: object
    Placement:
      additionalProperties: false
      properties:
        pool:
          description: "The pool to run in. Empty: the tenant's default pool, else the platform's, else the pool named default; resolved at submit and stored."
          type: string
        prefers:
          additionalProperties:
            type: string
          type: object
        requires:
          additionalProperties:
            type: string
          type: object
      type: object
    Pool:
      additionalProperties: false
      properties:
        currency:
          description: The currency of hourlyPrice (ISO 4217); both or neither.
          examples:
            - USD
          type: string
        hourlyPrice:
          description: "Static pools: the default hourly price of hosts registering into the pool, a decimal string with up to 9 fractional digits. Copied to each host when it first registers; changing it does not reprice existing hosts. Refused for ec2 pools, which the provider prices."
          examples:
            - "0.40"
          type: string
        isDefault:
          description: "Runs whose spec names no pool go to this pool (the tenant's; a platform default serves tenants without one). At most one per tenant: marking one clears the tenant's previous default. On create or update, omitted leaves the mark as it is. A body without provider changes only the mark of an existing pool: besides name and isDefault its fields must be absent or zero (\"\", 0, false, null, {}); any other value needs provider."
          type: boolean
        maxHosts:
          format: int64
          type: integer
        minHosts:
          format: int64
          type: integer
        name:
          type: string
        platform:
          description: A platform pool (no tenant). In a request, true is refused unless the caller acts on the platform's pools (an operator key without a tenant).
          readOnly: true
          type: boolean
        provider:
          type: string
        scaleDownAfter:
          description: "How long a provisioned host stays idle before it is released, e.g. 600s; empty: luxd's scale_down_after (default 10m)."
          oneOf:
            - examples:
                - 4h
              type: string
            - type: number
        shared:
          type: boolean
        template:
          additionalProperties: {}
          type: object
        tenant:
          description: The owning tenant's name; empty for a platform pool.
          readOnly: true
          type: string
        warmHosts:
          format: int64
          type: integer
        warmWhileActive:
          description: Keep warmHosts only while the pool is in use (a Run placed or ended within scaleDownAfter, or one waiting); an idle pool scales down to minHosts.
          type: boolean
      type: object
    PoolList:
      additionalProperties: false
      properties:
        pools:
          items:
            $ref: "#/components/schemas/Pool"
          type:
            - array
            - "null"
      type: object
    Port:
      additionalProperties: false
      properties:
        name:
          type: string
        port:
          format: int64
          type: integer
      type: object
    PostgresPoint:
      additionalProperties: false
      properties:
        at:
          format: date-time
          type: string
        bytes:
          description: Size of lux's database.
          format: int64
          type: integer
        connections:
          description: Backends connected to it.
          format: int64
          type: integer
      type: object
    ProcessSample:
      additionalProperties: false
      properties:
        cpuCores:
          description: "CPU in use, in cores: a rate over the previous point of the same process."
          format: double
          type: number
        goroutines:
          format: int64
          type: integer
        heapBytes:
          description: Go heap objects, live or not yet swept.
          format: int64
          type: integer
        peakRssBytes:
          description: "The highest RSS since the previous sample (a rollup: in its interval)."
          format: int64
          type: integer
        rssBytes:
          format: int64
          type: integer
        started:
          description: "When the process started: a change is a restart."
          format: date-time
          type: string
      type: object
    Push:
      additionalProperties: false
