info:
  description: |-
    The lux tenant API. Every /v1 call authenticates with an API key (`Authorization: Bearer <key>`); a key has scopes `read`, `run` and `admin`, each implying the ones before it.

    An operator key (`luxd admin create-operator-key`, scope `operator`) belongs to no tenant: it sees and acts on every tenant through the same operations. A Run's operations act in the Run's own tenant; lists span every tenant unless `?tenant=` (an id or a name) narrows them; creating needs `?tenant=`.

    Errors are JSON: `{"error": {"code": "not_found", "message": "...", "details": ["..."]}}`, with a stable `code`.
  title: lux
  version: dev
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusBody"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Error
      summary: Check luxd is up
  /v1/artifacts/{aid}:
    get:
      description: |-
        The file the Run wrote, streamed through luxd. Content-Length and X-Lux-SHA256 let a client tell a whole download from one cut short (the response is aborted, never ended cleanly, on a failure mid-way). 409 not_uploaded (with Retry-After) while it is still on its host; 410 gone once deleted by retention.

        Needs the `read` scope.
      operationId: downloadArtifact
      parameters:
        - description: The artifact's id.
          in: path
          name: aid
          required: true
          schema:
            description: The artifact's id.
            type: string
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                contentMediaType: application/octet-stream
                format: binary
                type: string
          description: The file.
          headers:
            Content-Disposition:
              description: attachment, with the file's name.
              schema:
                type: string
            Content-Length:
              description: The file's size.
              schema:
                type: integer
            X-Lux-SHA256:
              description: The file's SHA-256, hex.
              schema:
                type: string
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Conflict
        "410":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Gone
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Download an artifact
      tags:
        - runs
  /v1/costs:
    get:
      description: Needs the `read` scope.
      operationId: costSummary
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
