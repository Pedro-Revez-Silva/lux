  /v1/events:
    get:
      description: |-
        Server-sent events: one `lux` event per Run event, oldest first, each with its id (`id:`, and resume with Last-Event-ID or `after`). From now, from `after`, or the `last` N; with `follow=false` the stream ends after what is there now.

        Needs the `read` scope.
      operationId: eventFeed
      parameters:
        - description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
          explode: false
          in: query
          name: tenant
          schema:
            description: "Operator keys: only this tenant (id or name). Tenant keys ignore it."
            type: string
        - description: "From after this event id (default: from now)."
          explode: false
          in: query
          name: after
          schema:
            description: "From after this event id (default: from now)."
            type: string
        - description: Start with the last N events (at most 500), instead of from now.
          explode: false
          in: query
          name: last
          schema:
            description: Start with the last N events (at most 500), instead of from now.
            format: int64
            type: integer
        - description: "false: end after what there is now."
          explode: false
          in: query
          name: follow
          schema:
            description: "false: end after what there is now."
            type: string
        - description: "A reconnecting client's last event id: resumes after it."
          in: header
          name: Last-Event-ID
          schema:
            description: "A reconnecting client's last event id: resumes after it."
            type: string
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: "Server-sent events: `event: <type>` and `data: <JSON>` lines, each event ended by a blank line."
                items:
                  oneOf:
                    - description: A Run's event.
                      properties:
                        data:
                          $ref: "#/components/schemas/FeedEvent"
                        event:
                          const: lux
                          type: string
                      required:
                        - event
                        - data
                      title: lux
                      type: object
                    - description: The stream failed.
                      properties:
                        data:
                          $ref: "#/components/schemas/OutputError"
                        event:
                          const: error
                          type: string
                      required:
                        - event
                        - data
                      title: error
                      type: object
                type: array
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Forbidden
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Unprocessable Entity
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
          description: Internal Server Error
      security:
        - apiKey: []
      summary: Every Run's events, as they happen
      tags:
        - runs
